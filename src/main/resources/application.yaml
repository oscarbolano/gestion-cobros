server:
   port: 9081
   servlet:
      contextPath: /api/cobros/

spring:
  application:
    name: ApiCobros
  datasource:
    url: jdbc:h2:mem:gestioncobro
    driver-class-name: org.h2.Driver
    username: admin
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
